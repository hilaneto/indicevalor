<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">

    <title>Menu - Índice Valor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        body {background-color: #f4f4f4;}
        .sidebar {min-height: 100vh; background-color: #2f3439; padding: 20px;}
        .sidebar h4 {color: white;}
        .sidebar .nav-link {color: #dddddd; padding: 10px 12px; border-radius: 6px; margin-bottom: 6px;}
        .sidebar .nav-link:hover {background-color: #444a50; color: white;}
        .content {padding: 30px;}
        .topbar {background-color: white; border-bottom: 1px solid #dddddd; padding: 12px 20px;}
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- MENU LATERAL -->
            <aside class="col-12 col-md-3 col-lg-2 sidebar">
                <h4 class="mb-4">Índice Valor</h4>
                <nav class="nav flex-column">
                    <a href="{{ url_for('home.home') }}" class="nav-link">Início</a>
                    <a href="{{ url_for('download.downloads') }}" class="nav-link">Downloads</a>
                    <a href="{{ url_for('upload.upload') }}" class="nav-link">Upload</a>
                </nav>
            </aside>

            <!-- ÁREA PRINCIPAL -->
            <div class="col-12 col-md-9 col-lg-10 p-0">

                <!-- TOPO -->
                <div class="topbar d-flex justify-content-between align-items-center">
                    <div> <strong>Área do Sistema</strong> </div>
                    <div> Usuário: <strong>{{ session.get("usuario_login") }}</strong>
                        <a href="{{ url_for('auth.logout') }}"
                           class="btn btn-sm btn-outline-secondary ms-3">
                            Sair
                        </a>
                    </div>
                </div>

                <!-- CONTEÚDO -->
                <main class="content">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h3 class="mb-3">Bem-vindo</h3>
                            <p>Selecione uma opção no menu lateral.</p>
                        </div>
                    </div>
                </main>

            </div>

        </div>
    </div>

</body>

</html>
