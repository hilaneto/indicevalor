
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">

    <title>Contato | Índice Valor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <main class="container py-3">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow-sm form-contato">
                    <div class="card-body p-3">

                        <h5 class="text-center mb-2">Entre em contato</h5>

                        <p class="text-center text-secondary small mb-2">
                            Precisa de dados históricos ou informações sobre
                            indicadores econômicos? Conte-nos seu interesse.
                        </p>

                        {% if mensagem %}
                        <div class="alert {{ 'alert-success' if sucesso else 'alert-danger' }}" role="alert">
                            {{ mensagem }}
                        </div>
                        {% endif %}

                        <form method="POST" action="{{ url_for('contato.contato') }}">

                            <div class="mb-3">
                                <label for="nm_contato" class="form-label">Nome</label>
                                <input type="text" class="form-control"
                                       id="nm_contato" name="nm_contato"
                                       maxlength="80" placeholder="Digite seu nome"
                                       value="{{ request.form.get('nm_contato', '') if not sucesso else '' }}"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control"
                                       id="email" name="email"
                                       maxlength="120" placeholder="Digite seu e-mail"
                                       value="{{ request.form.get('email', '') if not sucesso else '' }}"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="celular" class="form-label">Celular</label>
                                <input type="tel" class="form-control"
                                       id="celular" name="celular"
                                       maxlength="20" placeholder="Digite seu celular"
                                       value="{{ request.form.get('celular', '') if not sucesso else '' }}"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Indicadores de interesse</label>
                                <p class="small text-secondary mb-2">
                                    Selecione os indicadores desejados (opcional).
                                </p>

                                <div class="row">
                                    {% for codigo, nome in indicadores.items() %}
                                    <div class="col-6 mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox"
                                                   id="indicador_{{ codigo }}"
                                                   name="indicadores" value="{{ codigo }}"
                                                   {% if not sucesso and codigo in request.form.getlist('indicadores') %}checked{% endif %}>
                                            <label class="form-check-label"
                                                   for="indicador_{{ codigo }}">
                                                {{ nome }}
                                            </label>
                                        </div>
                                    </div>
                                    {% endfor %}
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="comentario" class="form-label">Comentário</label>
                                <textarea class="form-control"
                                          id="comentario" name="comentario"
                                          rows="4" maxlength="200"
                                          placeholder="Descreva sua necessidade"
                                          required>{{ request.form.get('comentario', '') if not sucesso else '' }}</textarea>
                            </div>

                            <button type="submit" class="btn btn-primary btn-sm">Enviar contato</button>
                            <a href="{{ url_for('home.home') }}" class="btn btn-secondary btn-sm">Voltar</a>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

</body>
</html>
